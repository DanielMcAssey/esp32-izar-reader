name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      # secrets.h is gitignored but required to build; the example is enough here.
      - run: cp include/secrets.h.example include/secrets.h

      - name: Decoder unit tests (host)
        run: pio test -e native

      - name: Static analysis
        run: pio check -e usb

      - name: Firmware build
        run: pio run -e usb
